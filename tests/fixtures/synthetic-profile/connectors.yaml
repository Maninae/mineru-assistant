FINANCE_CLI_SKILL_NAME: sample-finance
FINANCE_CLI_SUBCOMMANDS:
  - cmd: samplefin transactions --days 7
    comment: Recent transactions
  - cmd: samplefin accounts
    comment: All linked accounts
  - cmd: samplefin budgets
    comment: Budget status

