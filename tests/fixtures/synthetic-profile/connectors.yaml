    schedule: 7:00 AM daily
    model: model-a
    instruction_file: recurring/sample-morning.md
  - name: Sample Weekly Check
    schedule: Sun 8:00 PM
    model: model-b
    instruction_file: recurring/sample-weekly.md

KEYCHAIN_SERVICES:
