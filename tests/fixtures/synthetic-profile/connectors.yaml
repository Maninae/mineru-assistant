    purpose: Chat bot API token
  - service: zephyr-webapp-passphrase-hash
    purpose: Web app passphrase gate

DEFAULT_MAIN_MODEL: model-alpha
DEFAULT_SUBAGENT_MODEL: model-beta
DEFAULT_DAEMON_MODEL: model-gamma

# Finance CLI on this synthetic install (fake product, exercises the same
# render-context shape as the real fixture).
